name: Celebrity Database Reset & Cleanup

on:
  workflow_dispatch:
    inputs:
      reset_score:
        description: 'Starting drama score for all celebrities'
        required: false
        default: '25'
        type: string
      days_to_process:
        description: 'Days of posts to reprocess'
        required: false
        default: '60'
        type: string
      create_backup:
        description: 'Create backup before reset'
        required: false
        default: true
        type: boolean

jobs:
  reset-celebrity-database:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests feedparser python-dateutil

    - name: 🎭 Create Enhanced Celebrity Reset Script
      run: |
        cat > celebrity_reset_enhanced.py << 'EOF'
        #!/usr/bin/env python3
        """
        Enhanced Celebrity Database Reset & Cleanup Tool
        Filters out invalid "celebrity" names and normalizes real ones
        """

        import yaml
        import json
        import re
        import os
        import sys
        from datetime import datetime, timedelta
        from pathlib import Path
        from collections import defaultdict, Counter
        import logging

        logging.basicConfig(level=logging.INFO, format='%(levelname)s: %(message)s')
        logger = logging.getLogger(__name__)

        class EnhancedCelebrityReset:
            def __init__(self, reset_score=25, days_to_process=60):
                self.base_path = Path('.')
                self.celebrities = {}
                self.RESET_DRAMA_SCORE = int(reset_score)
                self.DAYS_TO_PROCESS = int(days_to_process)

                # 🚫 BLACKLIST: Invalid "celebrity" names to remove
                self.CELEBRITY_BLACKLIST = {
                    # Sentence fragments
                    'you_are', 'women_to_make_an', 'if_you_still_work', 'and_encourages',
                    'lil_tay_claims', 'to_make_an', 'still_work', 'you_still',

                    # Generic terms
                    'celebrity', 'famous', 'star', 'news', 'latest', 'new', 'hot', 'trending',
                    'update', 'breaking', 'exclusive', 'report', 'story', 'drama', 'gossip',

                    # Common words that get picked up
                    'the', 'and', 'or', 'but', 'with', 'from', 'about', 'after', 'before',
                    'during', 'while', 'since', 'until', 'through', 'over', 'under',
                    'says', 'tells', 'reveals', 'admits', 'claims', 'denies', 'confirms',

                    # Partial names (keep full names only)
                    'kelce',  # Keep travis_kelce, jason_kelce, ed_kelce
                    'kardashian',  # Keep kim_kardashian, kourtney_kardashian, etc.
                    'jenner',  # Keep kylie_jenner, kendall_jenner
                    'swift',  # Keep taylor_swift
                    'bieber',  # Keep justin_bieber

                    # Numbers and weird entries
                    '1', '2', '3', '4', '5', '6', '7', '8', '9', '0',
                    'first', 'second', 'third', 'last', 'next', 'previous',

                    # Common non-celebrity terms
                    'show', 'movie', 'film', 'album', 'song', 'book', 'series',
                    'episode', 'season', 'chapter', 'part', 'volume',
                }

                # ✅ WHITELIST: Known good celebrity patterns
                self.CELEBRITY_WHITELIST = {
                    # Keep these even if they might match blacklist patterns
                    'saturday_night_live', 'snl',  # TV shows are OK
                    'travis_kelce', 'jason_kelce', 'ed_kelce',  # Kelce family
                    'kim_kardashian', 'kourtney_kardashian', 'khloe_kardashian',
                    'kylie_jenner', 'kendall_jenner', 'caitlyn_jenner',
                    'taylor_swift', 'justin_bieber', 'ariana_grande',
                }

                # 🔧 NAME NORMALIZATION RULES
                self.NAME_FIXES = {
                    'lil_tay_claims': 'lil_tay',  # Fix partial names
                    'saturday_night_live': 'saturday_night_live',  # Keep as is
                    'snl': 'saturday_night_live',  # Normalize SNL
                }

            def is_valid_celebrity_name(self, name):
                """Check if a name is a valid celebrity name"""
                if not name or not isinstance(name, str):
                    return False

                name_clean = name.lower().strip().replace(' ', '_')

                # Check whitelist first (always keep these)
                if name_clean in self.CELEBRITY_WHITELIST:
                    return True

                # Check blacklist
                if name_clean in self.CELEBRITY_BLACKLIST:
                    logger.info(f"🚫 Blacklisted: {name}")
                    return False

                # Length checks
                if len(name_clean) < 3:  # Too short
                    logger.info(f"🚫 Too short: {name}")
                    return False

                if len(name_clean) > 50:  # Too long (probably a sentence)
                    logger.info(f"🚫 Too long: {name}")
                    return False

                # Check for sentence-like patterns
                if any(word in name_clean for word in ['you_are', 'to_make', 'if_you', 'and_']):
                    logger.info(f"🚫 Sentence fragment: {name}")
                    return False

                # Check for too many words (probably not a name)
                word_count = len(name_clean.split('_'))
                if word_count > 4:  # More than 4 words is suspicious
                    logger.info(f"🚫 Too many words: {name}")
                    return False

                # Check for numbers in weird places
                if re.search(r'^\d+$', name_clean):  # Just a number
                    logger.info(f"🚫 Just a number: {name}")
                    return False

                # Check for common non-name patterns
                non_name_patterns = [
                    r'^(the|and|or|but|with|from)_',  # Starts with articles/prepositions
                    r'_(says|tells|reveals|claims|admits)$',  # Ends with verbs
                    r'^(breaking|exclusive|latest|new)_',  # News terms
                ]

                for pattern in non_name_patterns:
                    if re.search(pattern, name_clean):
                        logger.info(f"🚫 Non-name pattern: {name}")
                        return False

                return True

            def normalize_celebrity_name(self, name):
                """Normalize and fix celebrity names"""
                if not name:
                    return None

                name_clean = name.lower().strip().replace(' ', '_')

                # Apply specific fixes
                if name_clean in self.NAME_FIXES:
                    return self.NAME_FIXES[name_clean]

                # General normalization
                name_clean = re.sub(r'[^\w\s]', '', name_clean)  # Remove special chars
                name_clean = re.sub(r'\s+', '_', name_clean)  # Spaces to underscores
                name_clean = re.sub(r'_+', '_', name_clean)  # Multiple underscores to one
                name_clean = name_clean.strip('_')  # Remove leading/trailing underscores

                return name_clean if name_clean else None

            def load_and_filter_celebrities(self):
                """Load celebrities and filter out invalid ones"""
                try:
                    celebrities_file = self.base_path / '_data' / 'celebrities.yml'
                    if not celebrities_file.exists():
                        logger.warning("No celebrities.yml file found")
                        return {}

                    with open(celebrities_file, 'r', encoding='utf-8') as f:
                        raw_celebrities = yaml.safe_load(f) or {}

                    logger.info(f"📊 Loaded {len(raw_celebrities)} raw celebrity entries")

                    # Filter and normalize
                    filtered_celebrities = {}
                    removed_count = 0
                    normalized_count = 0

                    for celeb_key, celeb_data in raw_celebrities.items():
                        if not isinstance(celeb_data, dict):
                            logger.warning(f"🗑️ Invalid data structure for {celeb_key}")
                            removed_count += 1
                            continue

                        # Check if name is valid
                        if not self.is_valid_celebrity_name(celeb_key):
                            removed_count += 1
                            continue

                        # Normalize the name
                        normalized_name = self.normalize_celebrity_name(celeb_key)
                        if not normalized_name or not self.is_valid_celebrity_name(normalized_name):
                            removed_count += 1
                            continue

                        # Check for duplicates after normalization
                        if normalized_name in filtered_celebrities:
                            # Merge data, keeping higher score
                            existing_score = filtered_celebrities[normalized_name].get('drama_score', 0)
                            new_score = celeb_data.get('drama_score', 0)
                            if new_score > existing_score:
                                filtered_celebrities[normalized_name] = celeb_data
                            logger.info(f"🔄 Merged duplicate: {celeb_key} -> {normalized_name}")
                            continue

                        # Add to filtered list
                        if normalized_name != celeb_key:
                            normalized_count += 1
                            logger.info(f"🔧 Normalized: {celeb_key} -> {normalized_name}")

                        filtered_celebrities[normalized_name] = celeb_data

                    logger.info(f"✅ Filtered celebrities: {len(filtered_celebrities)} valid, {removed_count} removed, {normalized_count} normalized")
                    return filtered_celebrities

                except Exception as e:
                    logger.error(f"❌ Error loading celebrities: {e}")
                    return {}

            def reset_celebrity_scores(self, celebrities):
                """Reset all celebrity drama scores"""
                reset_count = 0
                now = datetime.now()

                for celeb_key, celeb_data in celebrities.items():
                    if isinstance(celeb_data, dict):
                        # Reset core fields
                        celeb_data['drama_score'] = self.RESET_DRAMA_SCORE
                        celeb_data['last_temperature_update'] = now.strftime('%Y-%m-%d %H:%M:%S')
                        celeb_data['status'] = self.calculate_celebrity_status(self.RESET_DRAMA_SCORE)
                        celeb_data['temperature_change'] = 0

                        # Ensure required fields exist
                        if 'memorial' not in celeb_data:
                            celeb_data['memorial'] = False
                        if 'discovery_date' not in celeb_data:
                            celeb_data['discovery_date'] = '2025-08-04'
                        if 'promotion_date' not in celeb_data:
                            celeb_data['promotion_date'] = '2025-08-04'
                        if 'category' not in celeb_data:
                            celeb_data['category'] = 'entertainment'

                        reset_count += 1

                logger.info(f"🔄 Reset {reset_count} celebrity scores to {self.RESET_DRAMA_SCORE}°")
                return celebrities

            def calculate_celebrity_status(self, drama_score):
                """Calculate celebrity status based on drama score"""
                if drama_score >= 80:
                    return 'explosive'
                elif drama_score >= 60:
                    return 'hot'
                elif drama_score >= 40:
                    return 'warm'
                elif drama_score >= 20:
                    return 'mild'
                else:
                    return 'cooling'

            def save_cleaned_celebrities(self, celebrities):
                """Save the cleaned and filtered celebrities"""
                try:
                    celebrities_dir = self.base_path / '_data'
                    celebrities_dir.mkdir(exist_ok=True)

                    celebrities_file = celebrities_dir / 'celebrities.yml'

                    # Create backup
                    if celebrities_file.exists() and os.getenv('CREATE_BACKUP', 'true').lower() == 'true':
                        backup_file = celebrities_dir / f'celebrities_backup_cleanup_{datetime.now().strftime("%Y%m%d_%H%M%S")}.yml'
                        import shutil
                        shutil.copy2(celebrities_file, backup_file)
                        logger.info(f"📋 Created backup: {backup_file.name}")

                    # Save cleaned celebrities
                    with open(celebrities_file, 'w', encoding='utf-8') as f:
                        yaml.dump(celebrities, f, default_flow_style=False, sort_keys=True, allow_unicode=True)

                    logger.info(f"💾 Saved {len(celebrities)} cleaned celebrities")

                except Exception as e:
                    logger.error(f"❌ Error saving celebrities: {e}")

            def generate_cleanup_report(self, celebrities):
                """Generate cleanup report"""
                total_celebs = len(celebrities)

                # Status distribution
                status_counts = Counter()
                for celeb_data in celebrities.values():
                    if isinstance(celeb_data, dict):
                        status = celeb_data.get('status', 'unknown')
                        status_counts[status] += 1

                # Top celebrities
                top_celebs = sorted(
                    [(k, v.get('drama_score', 0)) for k, v in celebrities.items() if isinstance(v, dict)],
                    key=lambda x: x[1], reverse=True
                )[:15]

                print("\n" + "="*60)
                print("🧹 CELEBRITY DATABASE CLEANUP REPORT")
                print("="*60)
                print(f"📊 Total Valid Celebrities: {total_celebs}")
                print(f"📈 Status Distribution: {dict(status_counts)}")
                print(f"🔄 Reset Score: {self.RESET_DRAMA_SCORE}°")
                print("\n🔥 TOP 15 CELEBRITIES AFTER CLEANUP:")
                for i, (celeb, score) in enumerate(top_celebs, 1):
                    print(f"  {i:2d}. {celeb.replace('_', ' ').title()}: {score}°")
                print("\n✅ Removed invalid entries like:")
                print("   - 'You Are', 'Women To Make An', 'If You Still Work'")
                print("   - Sentence fragments and generic terms")
                print("   - Numbers and partial names")
                print("   - Fixed 'Lil Tay Claims' -> 'Lil Tay'")
                print("="*60)

            def run(self):
                """Execute the enhanced cleanup"""
                print("🧹 Starting Enhanced Celebrity Database Cleanup...")

                # 1. Load and filter celebrities
                print("📂 Loading and filtering celebrity database...")
                celebrities = self.load_and_filter_celebrities()

                # 2. Reset scores
                print("🔄 Resetting celebrity scores...")
                celebrities = self.reset_celebrity_scores(celebrities)

                # 3. Save cleaned database
                print("💾 Saving cleaned celebrity database...")
                self.save_cleaned_celebrities(celebrities)

                # 4. Generate report
                self.generate_cleanup_report(celebrities)

                print("✅ Celebrity Database Cleanup Complete!")
                print("🎯 Your leaderboard should now show only real celebrities!")

        if __name__ == "__main__":
            reset_score = os.getenv('RESET_SCORE', '25')
            days_to_process = os.getenv('DAYS_TO_PROCESS', '60')

            cleanup_tool = EnhancedCelebrityReset(reset_score, days_to_process)
            cleanup_tool.run()
        EOF

    - name: 🧹 Run Enhanced Celebrity Cleanup
      env:
        RESET_SCORE: ${{ inputs.reset_score }}
        DAYS_TO_PROCESS: ${{ inputs.days_to_process }}
        CREATE_BACKUP: ${{ inputs.create_backup }}
      run: |
        python celebrity_reset_enhanced.py

    - name: 📊 Show Cleanup Results
      run: |
        echo "📋 Files changed:"
        git status --porcelain

        echo -e "\n📈 Celebrity database after cleanup:"
        if [ -f "_data/celebrities.yml" ]; then
          echo "✅ celebrities.yml updated"
          echo "📊 Celebrity count:"
          grep -c "^[a-z]" _data/celebrities.yml || echo "Could not count entries"
        fi

    - name: 🚀 Commit Cleanup
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Celebrity Cleanup Action"

        git add _data/celebrities.yml

        if ls _data/celebrities_backup_cleanup_*.yml 1> /dev/null 2>&1; then
          git add _data/celebrities_backup_cleanup_*.yml
        fi

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🧹 Celebrity Database Cleanup & Filtering

          - Removed invalid entries: 'You Are', 'Women To Make An', etc.
          - Fixed partial names: 'Lil Tay Claims' -> 'Lil Tay'  
          - Filtered out sentence fragments and generic terms
          - Normalized celebrity names and removed duplicates
          - Reset all scores to ${{ inputs.reset_score }}°

          Automated Celebrity Cleanup"

          git push
          echo "✅ Cleanup committed and pushed!"
        fi
