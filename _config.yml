# Site settings
title: "The Gossip Room"
email: <mailto:s@oursquadis.top>
description: >-
  Real-time celebrity gossip aggregation with drama scoring and trending analysis.
  Track the hottest entertainment news and rising stars with The Gossip Room.
baseurl: ""
url: "https://thegossroom.com"
github_username: stirlo
theme: minima

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: UTC

# 🎯 PERFORMANCE OPTIMIZATIONS
limit_posts: 100          # Only process 100 most recent posts
future: false            # Don't process future-dated posts
incremental: true        # Enable incremental builds

# Plugins (optimized)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-compose
  # Removed jekyll-feed - using custom solution

# Pagination (increased for daily top stories)
paginate: 33              # Show top 33 daily stories
paginate_path: "/page:num/"

# Collections
collections:
  celebrities:
    output: true
    permalink: /celebrities/:name/
  hot_stories:             # New collection for temperature-filtered posts
    output: true
    permalink: /hot/:year/:month/:day/:title/

# SEO and Social
author: "The Gossip Room"
social:
  name: "The Gossip Room"
  links:
    - "https://github.com/stirlo/thegossroom"

# Footer links
footer_links:
  license: "https://github.com/stirlo/thegossroom/blob/main/LICENSE"
  tfp: "https://tfp.la/"
  laboratory: "https://thelaboratory.cc"
  thank_you: "https://thelaboratory.cc/thankyou.html"

# 🎯 TEMPERATURE SYSTEM SETTINGS
temperature_system:
  daily_post_limit: 33
  minimum_temperature: 25    # Don't publish below this temperature
  aging_cutoff_days: 30     # Archive posts older than 30 days
  celebrity_boost_multiplier: 1.5
  time_decay_hours: 24      # Start decay after 24 hours

# Drama Index settings
drama_index:
  update_frequency: "hourly"
  score_decay: 0.9
  rising_star_threshold: 25  # Increased threshold
  explosive_threshold: 75    # Increased threshold

# RSS Processing (optimized)
rss_processing:
  max_articles_per_feed: 15  # Reduced from 20
  processing_frequency: "0 * * * *"
  deduplication_window: 7    # Reduced from 30 days
  temperature_threshold: 20  # Don't save posts below this

# Bluesky integration (optimized)
bluesky:
  max_posts_per_hour: 1     # Reduced frequency
  temperature_threshold: 50  # Only post hottest stories
  rising_star_alerts: true
  lookback_hours: 6         # Only consider last 6 hours

# Performance excludes
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - scripts/
  - requirements.txt
  - README.md
  - "*.py"
  - "_posts/202[0-3]-*"     # Exclude posts older than 2024
  - data/
  - scraper_debug.log

# 🎯 CUSTOM FEED SETTINGS
feed:
  posts_limit: 50
  excerpt_only: true
  path: /feed.xml
