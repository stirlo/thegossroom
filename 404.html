<script>
(function () {
  'use strict';

  // Levenshtein distance
  function lev(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = [...Array(b.length + 1).keys()];
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = a[i-1] === b[j-1]
          ? prev[j-1]
          : 1 + Math.min(prev[j], cur[j-1], prev[j-1]);
      }
      prev = cur;
    }
    return prev[b.length];
  }

  // Extract the most meaningful slug segment from the current path
  function getWantedSlug() {
    const parts = window.location.pathname
      .replace(/\/+$/, '')
      .toLowerCase()
      .split('/')
      .filter(Boolean);
    // Skip date segments like 2025, 08, 02
    const slug = parts.filter(p => !/^\d{1,4}$/.test(p)).pop();
    return slug || '';
  }

  function setStatus(msg, searching) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'not-found-status' + (searching ? ' searching' : '');
  }

  function showButtons() {
    document.getElementById('action-buttons').style.display = 'block';
  }

  function showRedirectNotice(url, title) {
    const el = document.getElementById('redirect-notice');
    el.style.display = 'block';
    el.innerHTML = `Found a close match: redirecting you to <strong>${title || url}</strong>…`;
  }

  async function smartRedirect() {
    const wantedSlug = getWantedSlug();

    if (!wantedSlug) {
      setStatus("Couldn't figure out what you were looking for.");
      showButtons();
      return;
    }

    try {
      const slugs = await fetch('/slugs.json').then(r => {
        if (!r.ok) throw new Error('slugs.json not found');
        return r.json();
      });

      let best = null, bestDist = Infinity;

      slugs.forEach(entry => {
        const d = lev(wantedSlug, entry.slug || '');
        if (d < bestDist) { bestDist = d; best = entry; }
      });

      // Tight match threshold: 3 edits max, and at most 30% of slug length
      const threshold = Math.max(2, Math.floor(wantedSlug.length * 0.3));

      if (best && bestDist <= threshold) {
        showRedirectNotice(best.url, best.title);
        setStatus(`Redirecting… (matched "${best.slug}")`);
        setTimeout(() => location.replace(best.url), 1200);
      } else {
        setStatus("That post doesn't seem to exist — it may have been removed.");
        showButtons();
      }
    } catch (err) {
      // slugs.json missing or network error — fail gracefully
      setStatus("That post doesn't seem to exist.");
      showButtons();
    }
  }

  smartRedirect();
})();
</script>
