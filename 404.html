title: "Finding a related story"
permalink: /404.html
robots: noindex
---

<style>
  .recovery-wrap {
    max-width: 680px;
    margin: 72px auto;
    padding: 0 24px;
    text-align: center;
  }
  .recovery-mark {
    color: #e8305a;
    font-size: 3.5rem;
    font-weight: 900;
    line-height: 1;
  }
  .recovery-wrap h1 {
    color: #f0f0f0;
    font-size: 1.6rem;
    margin: 18px 0 10px;
  }
  .recovery-status {
    color: #b8b8c8;
    min-height: 1.5em;
  }
  .recovery-status.searching::after {
    animation: recovery-pulse 0.8s ease-in-out infinite;
    background: #e8305a;
    border-radius: 50%;
    content: '';
    display: inline-block;
    height: 7px;
    margin-left: 9px;
    width: 7px;
  }
  .recovery-actions {
    display: none;
    margin-top: 28px;
  }
  .recovery-actions a {
    background: #c0254a;
    border-radius: 24px;
    color: #fff;
    display: inline-block;
    font-weight: 800;
    margin: 6px;
    padding: 12px 24px;
    text-decoration: none;
  }
  .recovery-actions a:last-child {
    background: rgba(255, 255, 255, 0.1);
  }
  @keyframes recovery-pulse {
    50% { opacity: 0.2; }
  }
</style>

<main class="recovery-wrap" aria-live="polite">
  <div class="recovery-mark" aria-hidden="true">◆</div>
  <h1>Finding the next chapter</h1>
  <p class="recovery-status searching" id="recovery-status">
    Matching this link with the latest related story…
  </p>
  <div class="recovery-actions" id="recovery-actions">
    <a href="/">Latest gossip</a>
    <a href="/archive/">Browse the archive</a>
  </div>
</main>

<script>
(function () {
  'use strict';

  const status = document.getElementById('recovery-status');
  const actions = document.getElementById('recovery-actions');

  function canonicalPath() {
    // Jekyll post URLs always end in a slash; normalize copied links to match.
    const decoded = decodeURI(window.location.pathname).replace(/\/+$/, '');
    return (decoded || '/') + (decoded === '' || decoded === '/' ? '' : '/');
  }

  function words(value) {
    return new Set(
      value.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean)
    );
  }

  function fallbackStory(live) {
    // Unknown legacy variants still receive a relevant live story based on
    // celebrity-tag components and meaningful words from the requested slug.
    const wanted = words(canonicalPath().split('/').filter(Boolean).pop() || '');
    let best = live[0] || null;
    let bestScore = -1;

    live.forEach(function (story) {
      const titleWords = words(story.title || '');
      let tagHits = 0;
      let titleHits = 0;
      (story.tags || []).forEach(function (tag) {
        const tagParts = tag.split('_').filter(function (part) { return part.length > 3; });
        if (tagParts.some(function (part) { return wanted.has(part); })) tagHits += 1;
      });
      wanted.forEach(function (word) {
        if (word.length > 3 && titleWords.has(word)) titleHits += 1;
      });
      const score = (tagHits * 100) + (titleHits * 10) + Number(story.heat || 0);
      if (score > bestScore) {
        best = story;
        bestScore = score;
      }
    });
    return best;
  }

  function continueTo(story) {
    if (!story || !story.url) throw new Error('No live stories available');
    status.className = 'recovery-status';
    status.textContent = 'Taking you to “' + (story.title || 'the latest related story') + '”…';
    window.setTimeout(function () { window.location.replace(story.url); }, 120);
  }

  fetch('/recovery-index.json', { cache: 'force-cache' })
    .then(function (response) {
      if (!response.ok) throw new Error('Recovery index unavailable');
      return response.json();
    })
    .then(function (index) {
      const position = index.redirects[canonicalPath()];
      const exact = Number.isInteger(position) ? index.live[position] : null;
      continueTo(exact || fallbackStory(index.live || []));
    })
    .catch(function () {
      status.className = 'recovery-status';
      status.textContent = 'The story desk is refreshing. Choose where to continue:';
      actions.style.display = 'block';
    });
})();
</script>
